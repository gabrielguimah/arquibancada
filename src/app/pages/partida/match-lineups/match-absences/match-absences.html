<!-- Desfalques: o expansível do site (fechado, só o título com a quantidade). -->
<app-collapsible [heading]="3" [(open)]="open">
  <span collapsible-label class="section-label">
    <img crest [src]="team().logo" alt="" width="18" height="18" />
    Desfalques
    <span class="count">{{ absences().length }}</span>
  </span>
  <ul>
    @for (a of absences(); track a.key) {
      <li [matTooltip]="a.name + (a.reason ? ' · ' + a.reason : '') + (a.doubtful ? ' · Dúvida' : '')">
        <img class="mini" playerPhoto [src]="a.photo" alt="" width="28" height="28" loading="lazy" />
        <span class="who">
          <span class="name">{{ a.name }}</span>
          @if (a.reason) {
            <small class="reason">{{ a.reason }}</small>
          }
        </span>
        @if (a.doubtful) {
          <span class="doubt">Dúvida</span>
        }
        <span class="icon" aria-hidden="true">
          @switch (a.kind) {
            @case ('injury') {
              <span class="cross"></span>
            }
            @case ('yellow') {
              <span class="card-icon"></span>
            }
            @case ('red') {
              <span class="card-icon red"></span>
            }
            @default {
              <mat-icon>remove_circle</mat-icon>
            }
          }
        </span>
      </li>
    }
  </ul>
</app-collapsible>
