<header class="topbar">
  <span class="logo"><mat-icon svgIcon="arquibancada" aria-hidden="true" />Arquibancada</span>
  <nav aria-label="Seções">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Classificação</a>
    <a routerLink="/estatisticas" routerLinkActive="active">Estatísticas</a>
  </nav>
  <span class="tag">Brasileirão {{ season }}</span>
  @if (notifications.supported) {
    <button
      type="button"
      class="bell"
      [class.on]="notifications.enabled()"
      (click)="notifications.toggle()"
      [matTooltip]="bellTip()"
      [attr.aria-label]="bellTip()"
      [attr.aria-pressed]="notifications.enabled()"
    >
      <mat-icon>{{ notifications.enabled() ? 'notifications_active' : 'notifications_off' }}</mat-icon>
    </button>
  }
  <mat-slide-toggle
    class="theme-toggle"
    labelPosition="before"
    hideIcon
    [checked]="theme.dark()"
    (change)="theme.setDark($event.checked)"
    aria-label="Modo escuro"
  >
    <mat-icon aria-hidden="true">{{ theme.dark() ? 'dark_mode' : 'light_mode' }}</mat-icon>
  </mat-slide-toggle>
</header>

<main>
  <router-outlet />
</main>

<app-goal-toasts />
