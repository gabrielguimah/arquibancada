<header class="topbar">
  <span class="logo"><img src="logo.png" alt="" width="34" height="30" /><span class="logo-text">Arquibancada</span></span>
  <nav aria-label="Seções">
    <!-- Campeonato: jogos, classificação e chances (no celular, em abas). -->
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Campeonato</a>
    <a routerLink="/times" routerLinkActive="active">Times</a>
    <a routerLink="/jogadores" routerLinkActive="active">Jogadores</a>
  </nav>
  <span class="tag">Brasileirão {{ season }}</span>
  <!-- Time do coração: escudo do time escolhido (ou coração vazio); abre a modal para escolher. -->
  @let fav = favorite.team();
  <button
    type="button"
    class="menu-button favorite-button"
    (click)="openFavorite()"
    [attr.aria-label]="fav ? 'Time do coração: ' + fav.name : 'Escolher time do coração'"
    [matTooltip]="fav ? 'Time do coração: ' + fav.name : 'Escolher time do coração'"
  >
    @if (fav) {
      <img crest [src]="fav.logo" alt="" width="30" height="30" />
    } @else {
      <mat-icon>favorite</mat-icon>
    }
  </button>
  <!-- Configurações (notificações, som, tema): só abrem pelo botão de menu. -->
  <button type="button" class="menu-button" [matMenuTriggerFor]="settings" aria-label="Configurações" matTooltip="Configurações">
    <mat-icon>menu</mat-icon>
  </button>
</header>

<!-- Cada item liga/desliga sem fechar o menu (fecha clicando fora ou no Esc). -->
<mat-menu #settings="matMenu" xPosition="before" class="settings-menu">
  @if (notifications.supported) {
    <button
      mat-menu-item
      role="menuitemcheckbox"
      [attr.aria-checked]="notifications.enabled()"
      (click)="$event.stopPropagation(); toggleNotifications()"
    >
      <mat-icon>{{ notifications.enabled() ? 'notifications_active' : 'notifications_off' }}</mat-icon>
      <span class="item">
        <span class="text">
          Notificações de gol
          @if (notifications.permission() === 'denied') {
            <small>Bloqueadas: libere nas configurações do site</small>
          }
        </span>
        <span class="switch" [class.on]="notifications.enabled()" aria-hidden="true"></span>
      </span>
    </button>
  }
  @if (sounds.supported) {
    <!-- Som dos avisos de gol (sino no gol, bloop no anulado). -->
    <button mat-menu-item role="menuitemcheckbox" [attr.aria-checked]="sounds.enabled()" (click)="$event.stopPropagation(); toggleSound()">
      <mat-icon>{{ sounds.enabled() ? 'volume_up' : 'volume_off' }}</mat-icon>
      <span class="item">
        <span class="text">Som dos avisos</span>
        <span class="switch" [class.on]="sounds.enabled()" aria-hidden="true"></span>
      </span>
    </button>
  }
  <button mat-menu-item role="menuitemcheckbox" [attr.aria-checked]="theme.dark()" (click)="$event.stopPropagation(); theme.setDark(!theme.dark())">
    <mat-icon>{{ theme.dark() ? 'dark_mode' : 'light_mode' }}</mat-icon>
    <span class="item">
      <span class="text">Modo escuro</span>
      <span class="switch" [class.on]="theme.dark()" aria-hidden="true"></span>
    </span>
  </button>
</mat-menu>

<main>
  <router-outlet />
</main>

<app-goal-toasts />
